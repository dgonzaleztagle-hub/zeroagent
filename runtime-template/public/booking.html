<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reserva tu hora</title><style>:root{font-family:Inter,system-ui,sans-serif;background:#08101c;color:#f5f8ff;--line:#2d3a55;--muted:#a2aec4;--brand:#16c996}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(560px,100%);background:#111a2b;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:0 18px 60px #0008}.tag{font-size:12px;color:#9af1d3;font-weight:800}.card h1{margin:8px 0}.card p{color:var(--muted);line-height:1.5}label{display:block;color:#c2cce0;font-size:12px;font-weight:700;margin:15px 0 6px}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:#091120;color:white;padding:11px;font:inherit}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{width:100%;border:0;background:var(--brand);color:#042017;border-radius:9px;padding:12px;font-weight:800;margin-top:18px;cursor:pointer}.note{font-size:12px;color:var(--muted);margin-top:13px}.result{margin-top:14px;line-height:1.5;color:#a9f0d6}.error{color:#ffc4d5}@media(max-width:520px){.row{grid-template-columns:1fr}.card{padding:20px}}</style></head><body><main class="card"><span class="tag">RESERVA EN LÍNEA</span><h1>Reserva tu hora</h1><p>Envía tu solicitud. Confirmaremos el horario según la disponibilidad real.</p><form id="form"><label>Nombre</label><input id="name" required><label>WhatsApp</label><input id="phone" required placeholder="+56 9…"><div class="row"><div><label>Servicio</label><select id="service" required></select></div><div><label>Profesional</label><select id="resource" required></select></div></div><label>Sede</label><select id="location"></select><label>Fecha y hora preferida</label><input id="starts" type="datetime-local" required><label>Comentario</label><textarea id="notes" rows="2"></textarea><button>Enviar solicitud</button><div id="result" class="note"></div></form></main><script>let data;async function load(){const r=await fetch('/api/agenda/public-catalog');const j=await r.json();if(!r.ok)throw Error(j.error);data=j;for(const [id,items] of Object.entries({service:data.catalog.services,resource:data.catalog.resources,location:data.catalog.locations})){const select=document.querySelector('#'+id);select.replaceChildren();for(const item of items){const option=document.createElement('option');option.value=String(item.name||'');option.textContent=String(item.name||'');select.append(option)}}}form.addEventListener('submit',async e=>{e.preventDefault();result.className='note';result.textContent='Enviando…';const r=await fetch('/api/agenda/appointments',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({source:'public_booking',customer_name:name.value,customer_phone:phone.value,service:service.value,resource:resource.value,location:location.value,starts_at:starts.value,notes:notes.value})});const j=await r.json();if(!r.ok){result.className='note error';result.textContent=j.error;return}result.className='result';result.textContent=`Solicitud ${j.appointment.reference||''} recibida. Te confirmaremos por WhatsApp.`;form.reset()});load().catch(e=>{result.className='note error';result.textContent='No se pudo cargar la agenda: '+e.message})</script></body></html>
