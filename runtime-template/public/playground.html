<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preview del agente</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#080d1c;color:#edf2ff}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.app{width:min(720px,100%);border:1px solid #27324b;border-radius:18px;background:#11182b;overflow:hidden;box-shadow:0 18px 60px #0007}.head{padding:22px;border-bottom:1px solid #27324b}.tag{display:inline-block;border-radius:99px;padding:5px 9px;background:#2a2355;color:#c9c0ff;font-size:12px;font-weight:700}.head h1{margin:9px 0 5px;font-size:22px}.head p{margin:0;color:#aeb9cf;font-size:14px}.messages{height:390px;overflow:auto;padding:20px;display:grid;align-content:start;gap:12px}.message{max-width:82%;padding:11px 13px;border-radius:14px;line-height:1.4}.user{justify-self:end;background:#635bff}.agent{background:#1d2a43}.meta{font-size:11px;color:#9ba9c1;margin-bottom:5px}.actions{display:flex;gap:8px;margin-top:9px}button{border:0;border-radius:9px;padding:9px 12px;background:#273754;color:#edf2ff;cursor:pointer}button:hover{filter:brightness(1.15)}.down{background:#573047}.composer{display:flex;gap:9px;padding:15px;border-top:1px solid #27324b}input{min-width:0;flex:1;border:1px solid #354461;background:#0c1222;color:#fff;border-radius:9px;padding:11px}.send{background:#16b987;font-weight:700}.feedback{padding:0 20px 15px;color:#ffccd8;font-size:13px}.hidden{display:none}.feedback input{width:100%;margin:8px 0}
  </style>
</head>
<body><main class="app"><section class="head"><span class="tag">MODO PREVIEW · NO ES WHATSAPP REAL</span><h1 id="agent-name">Agente de prueba</h1><p>Prueba conversaciones reales. Si una respuesta falla, indícanos cómo debió contestar.</p></section><section id="messages" class="messages"><div class="message agent"><div class="meta">Agente</div>Hola, soy la versión de prueba. ¿En qué te ayudo?</div></section><div id="feedback" class="feedback hidden"><strong>¿Cómo debió contestar?</strong><input id="expected" placeholder="Ej.: No tenemos estacionamiento propio."><button id="send-feedback">Enviar corrección</button></div><form id="composer" class="composer"><input id="message" autocomplete="off" placeholder="Escribe una pregunta real…" required><button class="send">Enviar</button></form></main>
<script>
const messages=document.querySelector('#messages'),form=document.querySelector('#composer'),input=document.querySelector('#message'),feedback=document.querySelector('#feedback'),expected=document.querySelector('#expected');let last={question:'',reply:''};
function add(text,who){const el=document.createElement('div');el.className=`message ${who}`;el.innerHTML=`<div class="meta">${who==='user'?'Tú':'Agente'}</div><div></div>`;el.lastElementChild.textContent=text;messages.append(el);messages.scrollTop=messages.scrollHeight;return el}
async function api(url,body){const accessKey=sessionStorage.getItem('zeroagent-preview-key')||'';const r=await fetch(url,{method:'POST',headers:{'content-type':'application/json','x-preview-key':accessKey},body:JSON.stringify(body)});const data=await r.json();if(r.status===401){const key=prompt('Esta preview requiere clave de acceso:');if(key){sessionStorage.setItem('zeroagent-preview-key',key);return api(url,body)}}if(!r.ok)throw new Error(data.error||'No se pudo completar la solicitud');return data}
async function rate(rating){try{await api('/api/preview/feedback',{rating,question:last.question,reply:last.reply});if(rating==='up'){alert('Feedback registrado.');return}feedback.classList.remove('hidden');expected.focus()}catch(e){alert(e.message)}}
form.addEventListener('submit',async e=>{e.preventDefault();const question=input.value.trim();if(!question)return;add(question,'user');input.value='';try{const data=await api('/api/preview/chat',{message:question});last={question,reply:data.reply.text};const bubble=add(data.reply.text,'agent');const actions=document.createElement('div');actions.className='actions';actions.innerHTML='<button>👍 Correcta</button><button class="down">👎 Corregir</button>';actions.children[0].onclick=()=>rate('up');actions.children[1].onclick=()=>rate('down');bubble.append(actions)}catch(err){add(`Error: ${err.message}`,'agent')}});
document.querySelector('#send-feedback').onclick=async()=>{try{await api('/api/preview/feedback',{rating:'down',question:last.question,reply:last.reply,expectedAnswer:expected.value});feedback.classList.add('hidden');expected.value='';alert('Corrección registrada para revisión.')}catch(e){alert(e.message)}};fetch('/health').then(r=>r.json()).then(d=>document.querySelector('#agent-name').textContent=d.agent||'Agente de prueba');
</script></body></html>
